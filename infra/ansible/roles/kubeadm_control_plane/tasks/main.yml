# kubeadm init from a versioned config, once. Re-runs only refresh the kubeconfig and the join
# command. Rebuilding the cluster goes through playbooks/reset.yml.
- name: kubeadm config
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: "0600"

- name: kubeadm init
  ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml --upload-certs
  args:
    creates: /etc/kubernetes/admin.conf

- name: kubeconfig directory for the vagrant user
  ansible.builtin.file:
    path: /home/vagrant/.kube
    state: directory
    owner: vagrant
    group: vagrant
    mode: "0700"

- name: kubeconfig for the vagrant user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/vagrant/.kube/config
    remote_src: true
    owner: vagrant
    group: vagrant
    mode: "0600"

- name: Read the admin kubeconfig
  ansible.builtin.slurp:
    src: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf

# Not in check mode (make lab_drift): it creates a bootstrap token, and a check only looks at
# workers that have joined already.
- name: Join command for the workers
  ansible.builtin.command: kubeadm token create --ttl 30m --print-join-command
  register: kubeadm_join
  changed_when: false
  when: not ansible_check_mode

- name: Join parameters
  when: not ansible_check_mode
  ansible.builtin.set_fact:
    kubeadm_join_token: "{{ kubeadm_join.stdout | regex_search('--token (\\S+)', '\\1') | first }}"
    kubeadm_join_ca_hash: "{{ kubeadm_join.stdout | regex_search('--discovery-token-ca-cert-hash (\\S+)', '\\1') | first }}"
