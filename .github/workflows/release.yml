name: release

# Each service is released on its own by pushing a tag `<service>-v<semver>`, e.g.
#   git tag order-v1.4.0 && git push origin order-v1.4.0
# which publishes artellas/rust-order:1.4.0, :1.4, :1 and :latest.
# Existing tags can be (re)released from Actions -> release -> Run workflow.
#
# The same file runs on the lab's Forgejo (git push lab order-v1.4.0). Repository variables set by
# the Ansible forgejo role switch it over; on GitHub they are unset and the defaults apply:
#   CI_PLATFORM      lab                    -> registry build cache, and the deploy-lab job runs
#   REGISTRY_HOST    registry.lab.internal  -> push there instead of Docker Hub
#   IMAGE_NAMESPACE  shop                   -> instead of artellas
#   BUILDKITD_CONFIG buildkitd.toml for the builder, e.g. to trust the lab CA
on:
  push:
    tags:
      - "catalog-v*"
      - "customer-v*"
      - "order-v*"
      - "restaurant-v*"
      - "payment-v*"
      - "api-gateway-v*"
  workflow_dispatch:
    inputs:
      tags:
        description: "Existing tags to release, separated by spaces or commas, e.g. order-v1.0.0 payment-v1.0.0"
        required: true
        type: string

jobs:
  # Turns the pushed tag, or the tags typed in the manual run, into the release matrix.
  tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.parse.outputs.tags }}
    steps:
      - name: Parse tags
        id: parse
        env:
          TAGS: ${{ inputs.tags || github.ref_name }}
        run: |
          tags=()
          for tag in ${TAGS//,/ }; do
            case "${tag%-v*}" in
              catalog|customer|order|restaurant|payment|api-gateway) ;;
              *) echo "::error::'$tag' is not a <service>-v<semver> tag"; exit 1 ;;
            esac
            tags+=("$tag")
          done
          if [ ${#tags[@]} -eq 0 ]; then
            echo "::error::no tags given"; exit 1
          fi
          json=$(printf '%s\n' "${tags[@]}" | sort -u | jq -R . | jq -cs .)
          echo "tags=$json" >> "$GITHUB_OUTPUT"
          echo "Releasing: $json"

  release:
    needs: tags
    # DOCKER_USERNAME and DOCKER_PASSWORD (a Docker Hub access token) are secrets of this environment.
    environment: Rust Microservices
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.tags.outputs.tags) }}
    steps:
      - name: Parse tag
        id: tag
        env:
          TAG: ${{ matrix.tag }}
        run: |
          echo "service=${TAG%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*-v}" >> "$GITHUB_OUTPUT"

      # Builds the tagged code, also when started manually from another branch.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ matrix.tag }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.REGISTRY_HOST && format('{0}/', vars.REGISTRY_HOST) || '' }}${{ vars.IMAGE_NAMESPACE || 'artellas' }}/rust-${{ steps.tag.outputs.service }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: ${{ vars.BUILDKITD_CONFIG }}

      # An empty registry means Docker Hub.
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The build context is the repository root so the image can see `shared`.
      - name: Build image and push to Docker Container Registry
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.tag.outputs.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ vars.CI_PLATFORM == 'lab' && format('type=registry,ref={0}/cache/rust-{1}', vars.REGISTRY_HOST, steps.tag.outputs.service) || format('type=gha,scope={0}', steps.tag.outputs.service) }}
          cache-to: ${{ vars.CI_PLATFORM == 'lab' && format('type=registry,ref={0}/cache/rust-{1},mode=max', vars.REGISTRY_HOST, steps.tag.outputs.service) || format('type=gha,mode=max,scope={0}', steps.tag.outputs.service) }}

      - name: Image digest
        run: echo "${{ steps.docker_build.outputs.digest }}"

  # Lab only: records the released versions in images.yaml of the repository LAB_ENV_REPO, which
  # Argo CD deploys from (deploy/argocd/templates/rust-microservices.yaml). The bump never touches
  # this repository, so main stays identical on GitHub and the lab. LAB_DEPLOY_TOKEN belongs to a
  # user that can only write to LAB_ENV_REPO.
  deploy-lab:
    needs: [tags, release]
    if: vars.CI_PLATFORM == 'lab'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-lab
      cancel-in-progress: false
    steps:
      - name: Bump the image tags
        env:
          TAGS: ${{ needs.tags.outputs.tags }}
          REPO: ${{ vars.LAB_ENV_REPO }}
          TOKEN: ${{ secrets.LAB_DEPLOY_TOKEN }}
          SERVER: ${{ github.server_url }}
        run: |
          # The token goes in a header per command, so it is never written to .git/config.
          auth="Authorization: Basic $(printf 'lab-deploy:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" clone --depth 1 "$SERVER/$REPO.git" env
          cd env
          git config user.name "lab-deploy"
          git config user.email "lab-deploy@users.noreply"
          for attempt in 1 2 3; do
            for tag in $(echo "$TAGS" | jq -r '.[]'); do
              service=${tag%-v*}; version=${tag##*-v}
              line="$service: {image: {tag: \"$version\"}}"
              if grep -q "^$service:" images.yaml; then
                sed -i "s|^$service:.*|$line|" images.yaml
              else
                echo "$line" >> images.yaml
              fi
            done
            git add images.yaml
            git diff --cached --quiet && { echo "Already deployed"; exit 0; }
            git commit -qm "Deploy $(echo "$TAGS" | jq -r 'join(", ")')"
            git -c http.extraHeader="$auth" push origin HEAD && exit 0
            # Another release pushed first: start again from its commit.
            git -c http.extraHeader="$auth" fetch --depth 1 origin && git reset -q --hard FETCH_HEAD
          done
          exit 1
