# Host metrics of the ops VM, scraped by Prometheus in the cluster (Phase 5). The Kubernetes
# nodes get node-exporter from kube-prometheus-stack instead.
- name: Directories
  ansible.builtin.file:
    path: "/opt/lab/node-exporter/{{ item }}"
    state: directory
    mode: "0755"
  loop: ["", textfile]

# The lab CA and the wildcard certificate (Caddy, the lab Gateway) are files on the Ansible host:
# their expiry becomes a metric (alert LabCertificateExpiring), refreshed by every provisioning
# run, which is also what renews the wildcard certificate.
- name: Expiry of the lab certificates
  ansible.builtin.shell:
    cmd: set -o pipefail; date -d "$(openssl x509 -noout -enddate -in {{ lab_ca_dir }}/{{ item }}.crt | cut -d= -f2)" +%s
    executable: /bin/bash
  loop: [ca, wildcard]
  register: lab_certificates
  delegate_to: localhost
  become: false
  changed_when: false

- name: Certificate expiry metric
  ansible.builtin.template:
    src: lab_certificates.prom.j2
    dest: /opt/lab/node-exporter/textfile/lab_certificates.prom
    mode: "0644"

# The CI runner has no metrics of its own (and Forgejo reports runners only to admins): a timer
# exports whether its container runs (alert LabCiRunnerOffline).
- name: CI runner state script
  ansible.builtin.template:
    src: ci-runner-metric.sh.j2
    dest: /opt/lab/node-exporter/ci-runner-metric.sh
    mode: "0755"

- name: CI runner state service and timer
  ansible.builtin.template:
    src: "lab-ci-runner-metric.{{ item }}.j2"
    dest: "/etc/systemd/system/lab-ci-runner-metric.{{ item }}"
    mode: "0644"
  loop: [service, timer]
  notify: Reload systemd

- name: Flush handlers (systemd knows the units)
  ansible.builtin.meta: flush_handlers

- name: CI runner state timer running
  ansible.builtin.systemd_service:
    name: lab-ci-runner-metric.timer
    state: started
    enabled: true

- name: Compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /opt/lab/node-exporter/compose.yaml
    mode: "0644"

- name: Running
  community.docker.docker_compose_v2:
    project_src: /opt/lab/node-exporter
    state: present
