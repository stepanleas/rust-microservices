# Homelab (Argo CD, deploy/argocd): images from the lab registry, routed through the shared HTTPS
# Gateway as https://shop.lab.internal. The image tag of each service comes from images.yaml in
# the lab-env repository, written by the release workflow.
global:
  image:
    registry: registry.lab.internal
    namespace: shop
  environment: lab
  # One request in ten traced: with every request traced, a 150 req/s load test pushed Tempo past
  # its 1 GiB memory limit (OOM) on a host already short of CPU.
  tracing:
    sampleRatio: "0.1"

# The broker's heap is capped: without a limit the JVM sized it from the worker's memory and
# the broker took ~1.2 GB of a laptop already short of RAM.
kafka:
  storageSize: 5Gi
  jvmOptions:
    -Xms: 256m
    -Xmx: 512m
  resources:
    requests: {cpu: 200m, memory: 768Mi}
    limits: {memory: 1Gi}

# The probes wait longer: after a cold boot of the VMs, 5 s timeouts under heavy CPU steal made
# every instance restart over and over instead of starting.
postgres:
  storageSize: 2Gi
  probes:
    # Explicit threshold: the default 1 h window (startDelay) at a 10 s period.
    startup: {timeoutSeconds: 15, periodSeconds: 10, failureThreshold: 360}
    liveness: {timeoutSeconds: 15, periodSeconds: 10, failureThreshold: 6}
    readiness: {timeoutSeconds: 15}

gateway:
  hostname: shop.lab.internal
  directRoutes: true
  parentRef: {name: lab, namespace: envoy-gateway-system, sectionName: https}

# Room to scale out under load (Phase 6); the load tests pin 1 or 3 (make pin_replicas).
catalog: &small
  autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 4}
customer: *small
order: *small
restaurant: *small
payment: *small
api-gateway: *small
