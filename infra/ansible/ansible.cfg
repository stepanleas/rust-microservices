[defaults]
inventory = inventory/lab.py
roles_path = roles
vault_password_file = ~/.lab/vault-pass
# The VMs get new host keys on every `vagrant destroy && vagrant up`.
host_key_checking = False
interpreter_python = auto_silent
forks = 10
stdout_callback = default
callback_result_format = yaml
display_skipped_hosts = False
# Run notified handlers even when a later task fails. Otherwise a changed file (e.g. the lab CA)
# never gets its handler (update-ca-certificates): the re-run sees no change and doesn't notify.
force_handlers = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
