services:
  catalog:
    image: artellas/rust-catalog:1
    container_name: catalog-container
    environment:
      ENVIRONMENT: production
      HTTP_URL: 0.0.0.0:8080
      SERVICE_NAME: catalog_api
      DATABASE_URL: postgres://postgres:postgres@catalog-db:5432/catalog_db
      KAFKA_HOST: kafka:29092
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      catalog-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://0.0.0.0:8080/api/health/ready | grep '\"status\":\"Ok\"' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rust-microservices-network

  catalog-db:
    image: postgres:18-alpine
    container_name: catalog-db-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catalog_db
    ports:
      - "5432:5432"
    volumes:
      - catalog-db:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d catalog_db" ]
      interval: 10s
      timeout: 30s
      retries: 15
    networks:
      - rust-microservices-network

  order:
    image: artellas/rust-order:1
    container_name: order-container
    environment:
      ENVIRONMENT: production
      HTTP_URL: 0.0.0.0:8081
      SERVICE_NAME: order_api
      DATABASE_URL: postgres://postgres:postgres@order-db:5432/order_db
      KAFKA_HOST: kafka:29092
      OUTBOX_POLL_INTERVAL_MS: 1000
      RUST_LOG: info
    ports:
      - "8081:8081"
    depends_on:
      order-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://0.0.0.0:8081/api/health/ready | grep '\"status\":\"Ok\"' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rust-microservices-network

  order-db:
    image: postgres:18-alpine
    container_name: order-db-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_db
    ports:
      - "5433:5432"
    volumes:
      - order-db:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d order_db" ]
      interval: 10s
      timeout: 30s
      retries: 15
    networks:
      - rust-microservices-network

  customer:
    image: artellas/rust-customer:1
    container_name: customer-container
    environment:
      ENVIRONMENT: production
      HTTP_URL: 0.0.0.0:8082
      SERVICE_NAME: customer_api
      DATABASE_URL: postgres://postgres:postgres@customer-db:5432/customer_db
      KAFKA_HOST: kafka:29092
      RUST_LOG: info
    ports:
      - "8082:8082"
    depends_on:
      customer-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://0.0.0.0:8082/api/health/ready | grep '\"status\":\"Ok\"' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rust-microservices-network

  customer-db:
    image: postgres:18-alpine
    container_name: customer-db-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customer_db
    ports:
      - "5434:5432"
    volumes:
      - customer-db:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d customer_db" ]
      interval: 10s
      timeout: 30s
      retries: 15
    networks:
      - rust-microservices-network

  restaurant:
    image: artellas/rust-restaurant:1
    container_name: restaurant-container
    environment:
      ENVIRONMENT: production
      HTTP_URL: 0.0.0.0:8083
      SERVICE_NAME: restaurant_api
      DATABASE_URL: postgres://postgres:postgres@restaurant-db:5432/restaurant_db
      KAFKA_HOST: kafka:29092
      OUTBOX_POLL_INTERVAL_MS: 1000
      RUST_LOG: info
    ports:
      - "8083:8083"
    depends_on:
      restaurant-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://0.0.0.0:8083/api/health/ready | grep '\"status\":\"Ok\"' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rust-microservices-network

  restaurant-db:
    image: postgres:18-alpine
    container_name: restaurant-db-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_db
    ports:
      - "5435:5432"
    volumes:
      - restaurant-db:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d restaurant_db" ]
      interval: 10s
      timeout: 30s
      retries: 15
    networks:
      - rust-microservices-network

  payment:
    image: artellas/rust-payment:1
    container_name: payment-container
    environment:
      ENVIRONMENT: production
      HTTP_URL: 0.0.0.0:8084
      SERVICE_NAME: payment_api
      DATABASE_URL: postgres://postgres:postgres@payment-db:5432/payment_db
      KAFKA_HOST: kafka:29092
      OUTBOX_POLL_INTERVAL_MS: 1000
      RUST_LOG: info
    ports:
      - "8084:8084"
    depends_on:
      payment-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://0.0.0.0:8084/api/health/ready | grep '\"status\":\"Ok\"' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rust-microservices-network

  payment-db:
    image: postgres:18-alpine
    container_name: payment-db-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_db
    ports:
      - "5436:5432"
    volumes:
      - payment-db:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d payment_db" ]
      interval: 10s
      timeout: 30s
      retries: 15
    networks:
      - rust-microservices-network

  api-gateway:
    image: artellas/rust-api-gateway:1
    container_name: api-gateway-container
    ports:
      - "8070:8070"
    depends_on:
      catalog:
        condition: service_healthy
      customer:
        condition: service_healthy
      order:
        condition: service_healthy
      restaurant:
        condition: service_healthy
      payment:
        condition: service_healthy
    environment:
      HTTP_URL: 0.0.0.0:8070
      RUST_LOG: info,api_gateway=debug
      MICROSERVICE_CATALOG_URL: "http://catalog:8080"
      MICROSERVICE_ORDER_URL: "http://order:8081"
      MICROSERVICE_CUSTOMER_URL: "http://customer:8082"
      MICROSERVICE_RESTAURANT_URL: "http://restaurant:8083"
      MICROSERVICE_PAYMENT_URL: "http://payment:8084"
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://0.0.0.0:8070/api/health/ready | grep '\"status\":\"Ok\"' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rust-microservices-network

  kafka:
    image: docker.io/apache/kafka:4.3.1
    container_name: kafka-container
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      # KRaft settings
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      # Listeners: INTERNAL for containers (kafka:29092), EXTERNAL for the host (localhost:9092)
      - KAFKA_LISTENERS=INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      # Single broker: the internal topics cannot be replicated.
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - rust-microservices-network

  kafka-init:
    image: docker.io/apache/kafka:4.3.1
    container_name: kafka-init-container
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh
      - ./kafka/topics:/topics
    entrypoint: [ "/bin/bash", "/create-topics.sh" ]
    environment:
      - KAFKA_BROKER=kafka:29092
    networks:
      - rust-microservices-network

volumes:
  catalog-db:
  order-db:
  customer-db:
  restaurant-db:
  payment-db:
  kafka-data:
    driver: local

networks:
  rust-microservices-network:
    driver: bridge
