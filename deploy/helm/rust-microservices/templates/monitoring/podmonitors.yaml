{{- if and .Values.metrics.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PodMonitor") }}
# Postgres (CloudNativePG's exporter in every instance, port 9187).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres
  labels:
    app.kubernetes.io/part-of: rust-microservices
spec:
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
---
# PgBouncer poolers (port 9127).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres-pooler
  labels:
    app.kubernetes.io/part-of: rust-microservices
spec:
  selector:
    matchExpressions:
      - {key: cnpg.io/poolerName, operator: Exists}
  podMetricsEndpoints:
    - port: metrics
---
# Kafka: the broker's metrics reporter and the kafka-exporter (both port 9404).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka
  labels:
    app.kubernetes.io/part-of: rust-microservices
spec:
  selector:
    matchLabels:
      strimzi.io/cluster: {{ .Values.kafka.name }}
  podMetricsEndpoints:
    - port: tcp-prometheus
{{- end }}
