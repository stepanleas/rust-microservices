# Forgejo Actions runner with the Docker executor. Registration is offline: Forgejo and the
# runner share a secret from the vault, so no token has to be copied from the web UI.
- name: Directory
  ansible.builtin.file:
    path: /opt/lab/forgejo-runner/data
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Register the runner in Forgejo
  ansible.builtin.command: >-
    docker exec -u git forgejo forgejo forgejo-cli actions register
    --name ops --secret {{ vault_forgejo_runner_secret }}
  no_log: true
  changed_when: false

- name: Runner credentials file
  ansible.builtin.command: >-
    docker run --rm -u 1000:1000 -v /opt/lab/forgejo-runner/data:/data -w /data
    {{ forgejo_runner_image }} forgejo-runner create-runner-file --name ops
    --instance https://git.{{ lab_domain }} --secret {{ vault_forgejo_runner_secret }}
  args:
    creates: /opt/lab/forgejo-runner/data/.runner
  no_log: true

- name: Runner config
  ansible.builtin.template:
    src: config.yml.j2
    dest: /opt/lab/forgejo-runner/data/config.yml
    mode: "0644"
  register: runner_config

- name: Compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /opt/lab/forgejo-runner/compose.yaml
    mode: "0644"

- name: Running
  community.docker.docker_compose_v2:
    project_src: /opt/lab/forgejo-runner
    state: present
    recreate: "{{ 'always' if runner_config.changed else 'auto' }}"
