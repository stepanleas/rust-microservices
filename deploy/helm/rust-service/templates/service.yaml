apiVersion: v1
kind: Service
metadata:
  name: {{ include "rust-service.name" . }}
  labels:
    {{- include "rust-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "rust-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
