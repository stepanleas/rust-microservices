[package]
name = "shared"
version = "2.0.0"
edition = "2024"

[features]
default = []
# Avro schemas and models of every Kafka message exchanged between the services.
contracts = ["dep:apache-avro", "dep:serde"]
# Transactional outbox: message model, ports and relay.
outbox = ["dep:serde", "dep:serde_json", "dep:chrono"]
# Postgres (diesel) implementation of the outbox repository.
outbox-postgres = ["outbox", "db"]
# Diesel r2d2 pool + embedded migrations.
db = ["dep:diesel", "dep:diesel_migrations"]
# Kafka (librdkafka) producer, consumer group and a listener with retries and a dead letter topic.
kafka = ["dep:rdkafka", "dep:futures"]
# actix-web building blocks: error responses, validated JSON, correlation id, blocking helper.
web = ["dep:actix-web", "dep:utoipa", "dep:validator", "dep:serde", "dep:serde_json", "dep:futures"]
# tracing-subscriber setup: env filter, `LOG_FORMAT=json` for Kubernetes.
logging = ["dep:tracing-subscriber"]
# Prometheus `/metrics` and OpenTelemetry traces (OTLP over HTTP) on top of `logging`. With `web`,
# also the actix middleware that records the HTTP metrics and continues the caller's trace.
observability = [
    "logging",
    "dep:metrics-exporter-prometheus",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
# mockall mocks of the outbox ports, for the services' unit tests.
mocks = ["dep:mockall", "outbox"]

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v4"] }

apache-avro = { version = "0.22.0", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock"], optional = true }
tracing = "0.1.44"
# Facade only: without the `observability` feature (no recorder installed) every metric is a no-op.
metrics = "0.24.6"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"], optional = true }
diesel = { version = "2.3.13", features = ["postgres", "r2d2", "uuid", "chrono", "serde_json"], optional = true }
diesel_migrations = { version = "2.3.2", optional = true }
# Builds librdkafka from source (needs a C toolchain, make, perl); `naive-runtime` blocks on delivery futures without tokio.
rdkafka = { version = "0.39.0", default-features = false, features = ["libz-static", "naive-runtime"], optional = true }
actix-web = { version = "4.15.0", optional = true }
utoipa = { version = "5.5.0", features = ["actix_extras"], optional = true }
validator = { version = "0.21.0", features = ["derive"], optional = true }
futures = { version = "0.3.34", optional = true }
mockall = { version = "0.15.0", optional = true }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, optional = true }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"], optional = true }
# Blocking HTTP client without TLS: spans are exported from the SDK's own thread to the node's Alloy.
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"], optional = true }
tracing-opentelemetry = { version = "0.34.0", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.8.2"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["kafka", "postgres"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "db"
required-features = ["db"]

[[test]]
name = "kafka"
required-features = ["kafka"]

[[test]]
name = "outbox"
required-features = ["outbox-postgres"]

[[example]]
name = "fail_payment"
required-features = ["contracts", "kafka", "outbox"]

[[bench]]
name = "avro"
harness = false
required-features = ["contracts"]
