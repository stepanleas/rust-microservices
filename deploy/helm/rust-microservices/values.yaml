# Production-like defaults. values-kind.yaml / values-lab.yaml override per target.

global:
  image:
    registry: ""          # e.g. registry.lab.internal; empty = Docker Hub
    namespace: artellas
    tag: latest
    pullPolicy: IfNotPresent
  environment: production
  # Kafka bootstrap address used by the services: <kafka.name>-kafka-bootstrap:9092.
  kafkaBootstrap: kafka-kafka-bootstrap:9092

kafka:
  # Strimzi Kafka cluster name; clients use <name>-kafka-bootstrap:9092.
  name: kafka
  version: 4.3.1
  storageSize: 10Gi
  partitions: 12
  # Exposes the broker outside the cluster on fixed NodePorts (kind: mapped to the host).
  external:
    enabled: false
    advertisedHost: localhost
    bootstrapNodePort: 30093
    brokerNodePort: 30094
    advertisedPort: 9094
    # Run the broker on the node whose NodePorts are reachable (kind: the ingress-ready worker).
    nodeSelector: {}
  # Every topic exchanged between the services (shared::contracts::topics).
  topics:
    - customer-created
    - customer-updated
    - product-created
    - product-updated
    - product-deleted
    - payment-created
    - payment-updated
    - restaurant-approval-request
    - restaurant-approval-response
    - restaurant-approval-cancel-request
    - payment-request
    - payment-response
  # Topics somebody consumes get a `<topic>.dlq` dead letter topic.
  deadLetterTopics:
    - customer-created
    - customer-updated
    - product-created
    - product-updated
    - product-deleted
    - restaurant-approval-request
    - restaurant-approval-response
    - restaurant-approval-cancel-request
    - payment-request
    - payment-response

postgres:
  # One CloudNativePG cluster `<service>-db` (+ pooler `<service>-db-pooler`) per service.
  clusters: [catalog, customer, order, restaurant, payment]
  instances: 1
  storageSize: 5Gi
  pooler:
    instances: 1
    # Session mode: the services use prepared statements (diesel) and a session advisory lock
    # around migrations. The pooler still bounds the server-side connections.
    poolMode: session
    maxClientConnections: 200
    defaultPoolSize: 40

gateway:
  enabled: true
  className: envoy
  # Empty = any hostname (kind: localhost).
  hostname: ""

# Shared by the services (templated with `tpl`).
x-common-env: &common-env
  ENVIRONMENT: "{{ .Values.global.environment }}"
  KAFKA_HOST: "{{ .Values.global.kafkaBootstrap }}"
  RUST_LOG: info
  LOG_FORMAT: json

catalog:
  port: 8080
  env:
    <<: *common-env
    SERVICE_NAME: catalog_api
  database: {enabled: true, cluster: catalog-db}

customer:
  port: 8082
  env:
    <<: *common-env
    SERVICE_NAME: customer_api
  database: {enabled: true, cluster: customer-db}

order:
  port: 8081
  env:
    <<: *common-env
    SERVICE_NAME: order_api
    KAFKA_GROUP_ID: order-service-group
  database: {enabled: true, cluster: order-db}

restaurant:
  port: 8083
  env:
    <<: *common-env
    SERVICE_NAME: restaurant_api
  database: {enabled: true, cluster: restaurant-db}

payment:
  port: 8084
  env:
    <<: *common-env
    SERVICE_NAME: payment_api
  database: {enabled: true, cluster: payment-db}

api-gateway:
  port: 8070
  env:
    RUST_LOG: info
    LOG_FORMAT: json
    MICROSERVICE_CATALOG_URL: http://catalog:8080
    MICROSERVICE_CUSTOMER_URL: http://customer:8082
    MICROSERVICE_ORDER_URL: http://order:8081
    MICROSERVICE_RESTAURANT_URL: http://restaurant:8083
    MICROSERVICE_PAYMENT_URL: http://payment:8084
  probes:
    # The gateway has no startup endpoint.
    startupPath: /api/health/live
