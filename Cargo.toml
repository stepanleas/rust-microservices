[package]
name = "api-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
reqwest = { version = "0.13.2", default-features = false, features = ["stream"] }
futures = "0.3.34"
http = "1.3.1"
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4"] }
anyhow = "1.0.104"
dotenv = "0.15.0"

[dev-dependencies]
uuid = { version = "1.26.1", features = ["v4"] }
