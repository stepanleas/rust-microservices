name: release

# Each service is released on its own by pushing a tag `<service>-v<semver>`, e.g.
#   git tag order-v1.4.0 && git push origin order-v1.4.0
# which publishes artellas/rust-order:1.4.0, :1.4, :1 and :latest.
# Existing tags can be (re)released from Actions -> release -> Run workflow.
on:
  push:
    tags:
      - "catalog-v*"
      - "customer-v*"
      - "order-v*"
      - "restaurant-v*"
      - "payment-v*"
      - "api-gateway-v*"
  workflow_dispatch:
    inputs:
      tags:
        description: "Existing tags to release, separated by spaces or commas, e.g. order-v1.0.0 payment-v1.0.0"
        required: true
        type: string

jobs:
  # Turns the pushed tag, or the tags typed in the manual run, into the release matrix.
  tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.parse.outputs.tags }}
    steps:
      - name: Parse tags
        id: parse
        env:
          TAGS: ${{ inputs.tags || github.ref_name }}
        run: |
          tags=()
          for tag in ${TAGS//,/ }; do
            case "${tag%-v*}" in
              catalog|customer|order|restaurant|payment|api-gateway) ;;
              *) echo "::error::'$tag' is not a <service>-v<semver> tag"; exit 1 ;;
            esac
            tags+=("$tag")
          done
          if [ ${#tags[@]} -eq 0 ]; then
            echo "::error::no tags given"; exit 1
          fi
          json=$(printf '%s\n' "${tags[@]}" | sort -u | jq -R . | jq -cs .)
          echo "tags=$json" >> "$GITHUB_OUTPUT"
          echo "Releasing: $json"

  release:
    needs: tags
    # DOCKER_USERNAME and DOCKER_PASSWORD (a Docker Hub access token) are secrets of this environment.
    environment: Rust Microservices
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.tags.outputs.tags) }}
    steps:
      - name: Parse tag
        id: tag
        env:
          TAG: ${{ matrix.tag }}
        run: |
          echo "service=${TAG%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*-v}" >> "$GITHUB_OUTPUT"

      # Builds the tagged code, also when started manually from another branch.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ matrix.tag }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: artellas/rust-${{ steps.tag.outputs.service }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The build context is the repository root so the image can see `shared`.
      - name: Build image and push to Docker Container Registry
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.tag.outputs.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.tag.outputs.service }}
          cache-to: type=gha,mode=max,scope=${{ steps.tag.outputs.service }}

      - name: Image digest
        run: echo "${{ steps.docker_build.outputs.digest }}"
