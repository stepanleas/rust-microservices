name: ci

on:
  push:
    branches:
      - main
      - feature/*
      - fix/*
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Picks the crates touched by the push/PR. A change to `shared` (or to the CI) re-checks every
  # crate, since all of them build against the local `shared` directory. Plain git, so the same
  # file runs on GitHub and on the lab's Forgejo (see scripts/ci/changed-crates.sh).
  changes:
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.crates.outputs.crates }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build crate list
        id: crates
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          crates=$(scripts/ci/changed-crates.sh "$BASE" "$GITHUB_SHA")
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
          echo "Crates to check: $crates"

  check:
    needs: changes
    if: needs.changes.outputs.crates != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.crates) }}
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }} -> target
          key: ${{ matrix.crate }}

      - name: Check code style
        run: cargo fmt --all -- --check

      - name: Check code
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Integration tests use testcontainers, which talk to the runner's Docker daemon.
      - name: Tests
        run: cargo test --workspace --all-features -- --nocapture
