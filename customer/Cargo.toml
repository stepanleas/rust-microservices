[workspace]
members = [
    "src/domain",
    "src/infrastructure",
    "src/application",
    "src/presentation",
    "src/starter",
    "src/messaging"
]
resolver = "2"

[workspace.dependencies]

# Web
actix-web = "4.15.0"
validator = { version = "0.21.0", features = ["derive"] }

# OpenAPI
utoipa = { version = "5.5.0", features = ["actix_extras", "uuid"] }
utoipa-actix-web = "0.1.2"
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Database and ORM
diesel = { version = "2.3.13", features = ["postgres", "r2d2", "uuid", "chrono"] }
diesel_migrations = "2.3.2"

# Logging and metrics
tracing = "0.1.44"
metrics = "0.24.6"

# Configuration
dotenv = "0.15.0"

# Error Handling
anyhow = "1.0.104"

# Testing
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
reqwest = { version = "0.13.2", features = ["json"]}
serial_test = "4.0.1"
mockall = "0.15.0"

# Misc
uuid = { version = "1.26.1", features = ["v4", "serde"] }
readonly = "0.2.14"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# Shared
shared = { path = "../shared" }
