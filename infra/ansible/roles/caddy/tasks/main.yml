# TLS termination for the ops services, with the lab wildcard certificate.
- name: Directories
  ansible.builtin.file:
    path: "/opt/lab/caddy/{{ item }}"
    state: directory
    mode: "0755"
  loop: ["", certs, data]

- name: Certificate
  ansible.builtin.copy:
    src: "{{ lab_ca_dir }}/{{ item.name }}"
    dest: "/opt/lab/caddy/certs/{{ item.name }}"
    mode: "{{ item.mode }}"
  loop:
    - {name: wildcard.crt, mode: "0644"}
    - {name: wildcard.key, mode: "0600"}
  register: caddy_certs

- name: Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/lab/caddy/Caddyfile
    mode: "0644"
  register: caddy_config

- name: Compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /opt/lab/caddy/compose.yaml
    mode: "0644"

- name: Running
  community.docker.docker_compose_v2:
    project_src: /opt/lab/caddy
    state: present
    recreate: "{{ 'always' if (caddy_certs.changed or caddy_config.changed) else 'auto' }}"
