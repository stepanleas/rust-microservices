{{- if .Values.gateway.enabled }}
{{- $parent := .Values.gateway.parentRef }}
{{- if not $parent }}
# North-south entry: Envoy (Gateway API) -> api-gateway, which routes /shop/<service>/...
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shop
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      {{- with .Values.gateway.hostname }}
      hostname: {{ . }}
      {{- end }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
spec:
  parentRefs:
    {{- if $parent }}
    {{- toYaml (list $parent) | nindent 4 }}
    {{- else }}
    - name: shop
    {{- end }}
  {{- with .Values.gateway.hostname }}
  hostnames: [{{ . | quote }}]
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api-gateway
          port: {{ index .Values "api-gateway" "port" }}
{{- end }}
