# The machine running the lab (become): KVM/libvirt, Vagrant, the lab network, split DNS and
# trust in the lab CA. Runs once, with `make lab_host` (prompts for the sudo password).
# A one-line source from HashiCorp's install docs pins a keyring file that goes stale when they
# rotate their signing key, and then every apt update on the machine fails. The deb822 source
# below re-downloads the key on each run; both at once would conflict on Signed-By.
- name: Remove the one-line HashiCorp apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/hashicorp.list
    state: absent

- name: HashiCorp apt repository
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: deb
    uris: https://apt.releases.hashicorp.com
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: https://apt.releases.hashicorp.com/gpg
  register: hashicorp_repo

- name: Virtualization, Vagrant and vagrant-libvirt build dependencies
  ansible.builtin.apt:
    name:
      - vagrant
      - qemu-kvm
      - libvirt-daemon-system
      - libvirt-clients
      - libvirt-dev
      - ebtables
      - dnsmasq-base
      - libxslt1-dev
      - libxml2-dev
      - zlib1g-dev
      - ruby-dev
      - build-essential
      - pkg-config
      - libnss3-tools
    update_cache: true
    cache_valid_time: "{{ 0 if hashicorp_repo.changed else 3600 }}"

- name: Manage VMs without sudo as {{ lab_user }}
  ansible.builtin.user:
    name: "{{ lab_user }}"
    groups: [libvirt, kvm]
    append: true

- name: libvirtd running
  ansible.builtin.service:
    name: libvirtd
    state: started
    enabled: true

# Isolated (no forwarding) network with fixed bridge name; the VMs reach the internet through
# vagrant-libvirt's NAT management network instead.
- name: Lab network definition
  ansible.builtin.template:
    src: network.xml.j2
    dest: /etc/libvirt/lab-network.xml
    mode: "0644"
  register: lab_network_xml

- name: Lab network state
  ansible.builtin.command: virsh -c qemu:///system net-info {{ lab.network.name }}
  register: lab_network_info
  changed_when: false
  failed_when: false

- name: Define the lab network
  ansible.builtin.shell: |
    set -e
    virsh -c qemu:///system net-destroy {{ lab.network.name }} 2>/dev/null || true
    virsh -c qemu:///system net-undefine {{ lab.network.name }} 2>/dev/null || true
    virsh -c qemu:///system net-define /etc/libvirt/lab-network.xml
    virsh -c qemu:///system net-autostart {{ lab.network.name }}
  when: lab_network_info.rc != 0 or lab_network_xml.changed
  changed_when: true

- name: Start the lab network
  ansible.builtin.command: virsh -c qemu:///system net-start {{ lab.network.name }}
  register: lab_network_start
  changed_when: lab_network_start.rc == 0
  failed_when: lab_network_start.rc != 0 and 'already active' not in lab_network_start.stderr

# Split DNS: only *.lab.internal goes to dnsmasq on the ops VM, through the lab bridge. libvirt
# recreates the bridge on every network start, so a hook re-applies it.
- name: libvirt hooks directory
  ansible.builtin.file:
    path: /etc/libvirt/hooks
    state: directory
    mode: "0755"

- name: Network hook for split DNS
  ansible.builtin.template:
    src: network-hook.sh.j2
    dest: /etc/libvirt/hooks/network
    mode: "0755"
  notify: Restart libvirtd

- name: Split DNS now
  ansible.builtin.shell: |
    set -eo pipefail
    before=$(resolvectl status {{ lab.network.bridge }} 2>/dev/null | grep -E 'DNS (Servers|Domain)' || true)
    /etc/libvirt/hooks/network {{ lab.network.name }} started begin -
    after=$(resolvectl status {{ lab.network.bridge }} | grep -E 'DNS (Servers|Domain)')
    [ "$before" = "$after" ] || echo changed
  args:
    executable: /bin/bash
  register: lab_split_dns
  changed_when: "'changed' in lab_split_dns.stdout"

- name: Trust the lab CA (system store)
  ansible.builtin.copy:
    src: "{{ lab_ca_dir }}/ca.crt"
    dest: /usr/local/share/ca-certificates/rust-microservices-lab-ca.crt
    mode: "0644"
  notify: Update CA certificates
