# Loki, monolithic: one pod with the logs on its own volume (no object storage; MinIO is no longer
# distributed). Alloy (deploy/platform/alloy) pushes the pod logs, Grafana reads them.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: index_, period: 24h}
  limits_config:
    retention_period: 168h
    # Service logs carry trace_id in their JSON body; Grafana links it to Tempo.
    allow_structured_metadata: true
    volume_enabled: true
    # A load test logs a lot at once.
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# Only the single binary: no caches, gateway, canary or test pod.
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
